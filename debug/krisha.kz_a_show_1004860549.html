<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/.safeline/static/favicon.png" type="image/png">
<title id="slg-title"></title>

<!-- Brand colours, fixed on purpose.

     NEVER write SafeLine's colour-placeholder token in this file, not even
     inside a comment. Substitution is plain string replacement with no
     awareness of comments, so naming the token injects a <style> block into
     the comment where it is silently discarded. That is what previously left
     --light-primary-color and --success-color undefined.

     All eight variables below are authoritative. challenge.js does
         getComputedStyle(html).getPropertyValue("--primary-color") || (…8 defaults…)
     so defining one makes it skip all eight — a partial set leaves the rest
     undefined, which is what broke the slider. -->
<style>
:root{
  --primary-color:#f5f5f7;                    /* #slg-bg canvas               */
  --light-primary-color:rgba(26,123,235,.25); /* slider mid-drag, its shadow  */
  --font-color:#242933;                       /* #sl-text, loader dots        */
  --light-font-color:rgba(0,0,0,.15);         /* #sl-check border, dot glow   */
  --success-color:#2ECC71;                    /* slider on completion         */

  /* The head script below copies these onto --primary-color, --font-color and
     --light-font-color. Set equal to their targets so the failure repaint is a
     no-op. The alert colour is applied to #sl-error in CSS instead, because
     --warning-font-color also drives every text node and the loader dots. */
  --warning-color:#f5f5f7;
  --warning-font-color:#242933;
  --warning-light-font-color:rgba(0,0,0,.15);

  --kg-ink:#242933;
  --kg-muted:#808a9c;
  --kg-accent:#1a7beb;
  --kg-accent-dark:#1568c9;
  --kg-alert:#F26B3A;
  --kg-logo-h:1.625rem;                       /* brand lockup logo height    */

  /* Horizontal padding on the card. This sets the content column width, which
     is what decides whether the request-ID chip fits on one line:
         content = min(34rem, 90vw) - 2 * --kg-card-pad-x
     Measured need for the chip row: 24px chip padding + ~84px label + 24px of
     gaps + ~269px for a 32-char id in 14px monospace + 19px copy button ≈ 420px.
     At 3rem the column is 448px, leaving ~28px of headroom, so the id holds one
     line. Raising this past ~3.25rem starts wrapping the id again. */
  --kg-card-pad-x:3rem;
}
</style>

<style>
html{min-height:100%}
body{
  min-height:100vh;margin:0;
  /* The canvas colour lives here, not only on #slg-bg. #slg-bg is flex:1 and
     stops above #slg-copyright, so without this the footer strip renders as
     bare white. */
  background-color:var(--primary-color);
  display:flex;flex-direction:column;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* Flex-centered, not fixed+transform: a fixed box pinned to the viewport
   has no scroll fallback, so a card taller than the visible viewport (long
   wrapped ru/kk copy, or other content sharing the page above it) gets its
   top clipped off-screen with no way to reach it. Flow layout scrolls instead. */
#slg-bg{background-color:var(--primary-color);flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 1rem}

#slg-box{
  position:relative;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;gap:1.5rem;
  width:90%;max-width:34rem;
  padding:3.5rem var(--kg-card-pad-x);
  background:#fff;border-radius:16px;
  box-shadow:0 8px 32px rgba(16,24,40,.08),0 1px 3px rgba(16,24,40,.04);
}

/* Logo lockup. Sits above the card, anchored to it. */
#kg-brand{
  position:absolute;left:50%;bottom:calc(100% + 2.5rem);
  transform:translateX(-50%);
  display:flex;align-items:center;gap:1.25rem;white-space:nowrap;
    color:var(--kg-ink);
}
/* Both marks are rasters now: kolesa.kz (584x96, ink #1D2129) and krisha.kz
   (548x96, ink #000). One rule covers both — aspect ratio locked via
   width:auto so only the shared height var needs to move. Neither can be
   retinted through CSS; the colour is baked into each PNG's pixels. */
#kg-brand img{display:block;height:var(--kg-logo-h);width:auto}
#kg-brand a{display:flex;align-items:center;border-radius:4px}
#kg-brand a:focus-visible{outline:2px solid var(--kg-accent);outline-offset:4px}
#kg-brand .kg-sep{width:1px;height:var(--kg-logo-h);background:#d4d7dd}

#slg-image{display:flex;align-items:center;justify-content:center}
#slg-warning{display:block;width:5.25rem;height:auto}

#slg-caption{display:flex;flex-direction:column;gap:.75rem;align-items:center;text-align:center;color:var(--font-color)}

/* Explicit colours: g()-style var remapping happens on <html>, so element-level
   rules win in every state without !important. */
#slg-text{
  display:block;color:#242933;
  font-size:1.5rem;font-weight:600;line-height:1.17;
  margin:0;
}
#slg-desc{
  color:#808a9c;font-size:1rem;line-height:1.25;margin:0;
  max-width:26rem;margin-left:auto;margin-right:auto;
}

/* Event ID — the value the DOMContentLoaded handler scrapes. Given its own
   slot so it no longer overwrites the reason text. Hidden until populated. */
#kg-event{
  /* baseline, not center: the label is sans and the id is monospace, and the
     two faces place glyphs differently inside a box of the same height. Centring
     the boxes therefore leaves the digits visibly off against the label. Their
     baselines are what the eye reads as aligned. The copy button is a glyph, not
     text, so it opts out via align-self below. */
  display:none;align-items:baseline;gap:.75rem;   /* gap was .3125rem — too tight */
  max-width:100%;box-sizing:border-box;
  padding:.75rem 1rem;
  background:#f3f6f8;border-radius:12px;
  font-size:1rem;line-height:1.25;
  color:#808a9c;
}
#kg-event.is-visible{display:inline-flex}
/* The label had no rule, so as a flex item it inherited flex-shrink:1 and
   min-width:auto and was the first thing to collapse when the row ran out of
   width. Pinning it moves any shortfall onto the id instead. */
#kg-event-label{
  white-space:nowrap;flex:0 0 auto;
  font-size:.9375rem;color:var(--kg-muted);
  line-height:1.4;                /* shared with the value so the row height is
                                     set by one number, not by two font metrics */
}
#kg-event-value{
  color:var(--kg-ink);user-select:all;flex:0 0 auto;
  /* monospace is both narrower per glyph than the sans stack at this size and
     the correct face for an id that gets read aloud or compared by eye */
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:.875rem;letter-spacing:0;line-height:1.4;
  white-space:nowrap;             /* the whole point: never split the id */
}
#kg-event-copy{
  display:inline-flex;flex:0 0 auto;border:0;background:transparent;cursor:pointer;padding:2px;
  color:var(--kg-ink);border-radius:4px;
  /* an icon has no meaningful baseline — a button's is its content's, which
     would hang the glyph below the text. Centre it in the row instead. */
  align-self:center;
}
#kg-event-copy svg{display:block;width:15px;height:auto}
#kg-event-copy:hover{background:#e6e8ec}
#kg-event-copy:focus-visible{outline:2px solid #0f7a3d;outline-offset:1px}

#slg-copyright{
  text-align:center;width:100%;
  padding:0 1rem 2.5rem;
}
#slg-copyright a{color:#9ca3af;text-decoration:none;font-size:.875rem}
#slg-copyright a:hover{color:#6b7280}
#slg-copyright a:focus-visible{outline:2px solid var(--kg-accent);outline-offset:3px;border-radius:2px}
#slg-copyright-text{margin-top:0;display:inline-block}
.link-site-company{display:flex;justify-content:center}

/* Support CTA now lives inside the card as a filled button, per design. */
#kg-support{width:100%;display:flex;justify-content:center}
/* Styled once and left unscoped on purpose: challenge mode must not override
   this, so the CTA is byte-for-byte the same control on both pages. Colours
   come from the shared accent vars rather than repeated literals. */
#kg-support a{
  display:inline-flex;align-items:center;justify-content:center;
  width:min(17.5rem,100%);min-height:3.5rem;padding:.5rem 1rem;box-sizing:border-box;
  background:var(--kg-accent);border-radius:.75rem;
  color:#fff;font-size:1rem;font-weight:500;text-decoration:none;
}
#kg-support a:hover{background:var(--kg-accent-dark)}
#kg-support a:focus-visible{outline:2px solid var(--kg-accent);outline-offset:3px}

/* ─────────────────────────────────────────────────────────────────────────────
   CHALLENGE MODE

   SafeLine serves this same document for the human-verification page and
   appends its bootstrap plus a #sl-box that challenge.js fills at runtime.
   html.kg-challenge is set by the script below; #sl-box is then moved inside
   #slg-box so the card, brand lockup, support link and footer are identical
   on both pages.

   challenge.css is appended to <head> at runtime — AFTER this block — so every
   #sl-* rule needs one extra element selector to win the tie. Hence `html`.
   ───────────────────────────────────────────────────────────────────────────── */
html.kg-challenge #slg-image,
html.kg-challenge #slg-caption,
html.kg-challenge #kg-event{display:none}

html.kg-challenge #slg-box{padding:3rem 2.5rem;gap:1.75rem}

/* position:relative, not static: #sl-slide-bar and #sl-slider are absolutely
   positioned at top:5rem and resolve against the nearest positioned ancestor,
   so #sl-box has to stay a containing block. */
html.kg-challenge #sl-box{
  position:relative;top:auto;left:auto;right:auto;bottom:auto;
  -webkit-transform:none;transform:none;
  display:flex;flex-direction:column;align-items:center;gap:1.5rem;
  width:100%;max-width:none;height:auto;min-height:0;
  margin:0;padding:0;
  border-radius:0;box-shadow:none;
  z-index:auto;font-family:inherit;
  /* g() writes background-color:var(--warning-color) INLINE on #sl-box for the
     failure state, which paints a grey band across the white card. An inline
     style can only be beaten by an author !important declaration — this is the
     one place in the file where it is the correct tool, not a shortcut. */
  background-color:transparent!important;
}
/* These four restate rules we were previously inheriting from challenge.css.
   That file is fetched from the challenge host and appended AFTER this block,
   so anything relying on it breaks wherever it is absent — the local preview,
   and production if the request fails. Centering and the three default-hidden
   elements are worth owning outright rather than borrowing.

   display:none is safe here: challenge.js reveals each one by writing an inline
   display, which beats any stylesheet rule. */
html.kg-challenge #sl-desc{flex:none;width:100%;text-align:center}

html.kg-challenge #sl-box:has(#sl-slide-bar){min-height:9rem}

html.kg-challenge #sl-text{
  color:var(--kg-ink);font-size:1.5rem;font-weight:600;line-height:1.25;
  display:block;
}
html.kg-challenge #sl-error-msg{
  color:var(--kg-muted);font-size:.8125rem;line-height:1.4;
  word-break:break-word;padding-top:.5rem;
}

/* SafeLine's real #sl-error is an inline <svg>, not an <img> - confirmed from
   a live failure state: <svg id="sl-error" ...><g fill="var(--warning-font-color)">
   <g><path .../></g></g></svg>. content:url() replacing a live <svg> root is
   not reliably supported across browsers, and this page has to render for
   arbitrary visitors, not just our own dev browser - so instead of replacing
   the element, its own vector is made invisible and our icon is painted as a
   background image in the same box. fill lives on the <g> as a presentation
   attribute (var(--warning-font-color)), which is the lowest-priority form of
   styling there is - any real CSS rule beats it with no specificity fight,
   html.kg-challenge kept only for consistency with the rest of this block.
   width/height stay off the <svg> itself: 68x59 intrinsic ratio from its own
   width/height attributes still sizes the box correctly under width-only CSS,
   same as before. */

html.kg-challenge #sl-error path{fill:transparent!important}

html.kg-challenge .sl-loader-dot:before{background-color:var(--kg-accent);box-shadow:none;opacity:.85}

html.kg-challenge #sl-check{
  display:none;                    /* JS sets inline-block when it is needed */
  margin: auto;
  background-color:var(--kg-accent);color:#fff;
  border:none;border-radius:.75rem;
  width:min(17.5rem,100%);min-height:3.5rem;
  padding:.5rem 1rem;box-sizing:border-box;
  font-size:1rem;font-weight:500;font-family:inherit;
}
html.kg-challenge #sl-check:hover{border:none;background-color:var(--kg-accent-dark);color:#fff}
html.kg-challenge #sl-check span:last-child{display:none}   /* upstream ripple */
html.kg-challenge #sl-check:focus-visible{outline:2px solid var(--kg-accent);outline-offset:2px}

/* Upstream paints the bar with --font-color (near-black) and the handle with
   --primary-color (canvas grey on a grey bar). */
html.kg-challenge #sl-slide-bar{background:#eceef2;height:2.75rem}
html.kg-challenge #sl-slide-track{background:var(--kg-accent);opacity:.22}
html.kg-challenge #sl-slide-target{background:rgba(26,123,235,.14)}
html.kg-challenge #sl-slider{
  background:var(--kg-accent);
  box-shadow:0 4px 12px rgba(26,123,235,.35);
  /* scoped redefinition recolours the arrow and tick SVGs, which are
     fill="var(--font-color)", without touching anything global */
  --font-color:#ffffff;
}

/* The card stops growing at max-width:34rem, so below ~604px viewport it is
   90vw and shrinking. nowrap past that point would push the chip out through
   the card's side, which is worse than a wrapped id — so the guarantee is
   released here, where the column first gets too narrow to honour it. */
@media (max-width:620px){
  #kg-event-value{white-space:normal;word-break:break-all;flex:0 1 auto;min-width:0}
}
@media (max-width:520px){
  #slg-box,html.kg-challenge #slg-box{padding:2.5rem 1.5rem;gap:1.25rem}
  :root{--kg-logo-h:1.25rem}
  #kg-brand{gap:.875rem;bottom:calc(100% + 1.75rem)}
  #slg-text,html.kg-challenge #sl-text{font-size:1.25rem}
  #slg-desc{font-size:.9375rem}
  #slg-warning{width:4.5rem}
  /* No type size fits a 32-char id beside a label in this column, so drop the
     nowrap guarantee here and let it break rather than overflow the card. */
  #kg-event{font-size:.875rem;padding:.625rem .75rem;gap:.5rem}
  #kg-event-value{font-size:.8125rem;white-space:normal;word-break:break-all;flex:0 1 auto;min-width:0}
  html.kg-challenge #sl-error{width:4.5rem}
}
/* Below ~420px a 32-char id cannot share a row with the label at any sane type
   size. Rather than break the id mid-string, give the label its own row — it
   stays on one line, and value + copy button wrap together onto the second. */
@media (max-width:420px){
  #kg-event{flex-wrap:wrap;justify-content:center;row-gap:.25rem}
  #kg-event-label{flex:1 0 100%;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

          ru:"Проверка браузера — Kolesa Group", kk:"Браузерді тексеру — Kolesa Group"},

  footer: {en:"kolesa group", zh:"kolesa group", ru:"kolesa group", kk:"kolesa group"}
};

/* Locale comes from the URL, not the browser.

   Krisha and Kolesa serve Kazakh under a /kz path prefix and Russian at the
   bare path, so the URL is what the visitor actually chose — navigator.language
   is the machine's setting and regularly disagrees with it. The challenge is
   served in place, so location.pathname is still the path that was requested.

   The (\/|$) guard matters: without it /kzt or /kzakhstan would read as Kazakh.
   Anything that is not /kz is Russian; en and zh remain in the table only as a
   fallback for a key that lacks a translation. */
var KZ_PATH_RE = /^\/kz(\/|$)/i;

function pageLocale(){
  try {
    if (KZ_PATH_RE.test(location.pathname)) return "kk";
  } catch(e){}
  return "ru";
}

/* Selector keyed on the page locale. Falls through to en only when the string
   is missing for the resolved locale, which should not happen for keys in this
   table but keeps a missing translation visible rather than blank. */
function o(e){
  var n = t[e];
  if (n === undefined) n = t.unknown;
  var loc = pageLocale();
  return n[loc] || n.ru || n.en;
}

function i(id, prop, val){ var el = document.getElementById(id); if (el) el[prop] = val; }

/* Support links differ per brand, and one Custom HTML may serve both. Resolved
   from the host at render time rather than hardcoded, so the same file works
   on either without an edit.

   Anchors as in KG_HOST_RE: (^|\.) stops evilkolesa.kz matching and $ stops
   kolesa.kz.attacker.com. Unknown hosts fall back to Kolesa as the group's
   main property rather than leaving a dead link. */
/* Which brand's support page to offer.

   Host alone is not enough. On id.kolesa.kz the page is served from a shared
   host, so location.hostname says "kolesa" for every visitor — including one
   who was on krisha.kz a moment ago. Three signals, most reliable first:

     1. an explicit ?brand= / ?site= param, if SafeLine is configured to pass one
     2. the referrer's hostname — the page the visitor actually came from
     3. this page's own hostname, correct whenever the challenge is served
        in place on the brand's own domain

   Referrer caveat: a cross-origin referrer survives the common
   strict-origin-when-cross-origin policy as a bare origin, which is all this
   needs. Under no-referrer it arrives empty and we fall through to hostname.
   Same-origin navigations keep the full URL — also fine. */
var BRANDS = [
  {
    key:     "krisha",
    host:    /(^|\.)krisha\.kz$/i,
    mobile:  /^m\.krisha\.kz$/i,
    desktop: "https://krisha.kz/content/special/write-us/message",
    mobileUrl: "https://m.krisha.kz/content/special/write-us/message"
  },
  {
    key:     "kolesa",
    host:    /(^|\.)kolesa\.kz$/i,
    mobile:  /^m\.kolesa\.kz$/i,
    desktop: "https://kolesa.kz/content/service/write-us/",
    mobileUrl: "https://m.kolesa.kz/content/service/write-us/"
  }
];

/* Hostname of the referring page, or "" when unavailable. Parsed via URL rather
   than a regex so a malformed referrer throws here instead of matching
   something unintended. */
function referrerHost(){
  try {
    if (!document.referrer) return "";
    return new URL(document.referrer).hostname || "";
  } catch(e){ return ""; }
}

function brandFromHost(h){
  if (!h) return null;
  for (var k = 0; k < BRANDS.length; k++) {
    if (BRANDS[k].host.test(h)) return { brand: BRANDS[k], host: h };
  }
  return null;
}

/* Hosts that serve the challenge for more than one brand. On these the page's
   own hostname says nothing about who the visitor is, so the referrer decides.
   Everywhere else the hostname is authoritative — a visitor who clicked from
   krisha.kz to kolesa.kz and got challenged there is on a Kolesa page and
   should get Kolesa support, referrer notwithstanding.

   Both spellings covered; adjust once the live host is confirmed. */
var SHARED_HOSTS = /^(sl-)?id\.kolesa\.kz$/i;

function resolveBrand(){
  /* 1. explicit param, if the WAF is configured to pass one. Trusted above
        everything else because it is the only signal that is deliberate. */
  try {
    var q = new URLSearchParams(location.search);
    var named = (q.get("brand") || q.get("site") || "").toLowerCase();
    for (var k = 0; k < BRANDS.length; k++) {
      if (named === BRANDS[k].key) return { brand: BRANDS[k], host: "" };
    }
  } catch(e){}

  /* 2. this page's own host, unless it is shared between brands */
  var shared = true;
  try { shared = SHARED_HOSTS.test(location.hostname); } catch(e){}
  if (!shared) {
    var viaSelf = brandFromHost(location.hostname);
    if (viaSelf) return viaSelf;
  }

  /* 2b. on the shared auth host, ?destination= names where login returns to
        (e.g. id.kolesa.kz/login/?destination=https://krisha.kz/my). Parsed
        without a base so a relative destination throws and is ignored rather
        than resolving to id.kolesa.kz. Only known brands match. */
  if (shared) {
    try {
      var dest = new URLSearchParams(location.search).get("destination");
      var viaDest = dest && brandFromHost(new URL(dest).hostname);
      if (viaDest) return viaDest;
    } catch(e){}
  }

  /* 3. where the visitor came from. Only trusted when it names a brand we
        know — an arbitrary referrer must not select anything. */
  var viaRef = brandFromHost(referrerHost());
  if (viaRef) return viaRef;

  return null;
}

function supportUrl(){
  try {
    var r = resolveBrand();
    if (!r) return BRANDS[1].desktop;
    /* Mobile only when the matched host was itself an m. host. A desktop
       referrer must not produce a mobile link, or vice versa. */
    return (r.host && r.brand.mobile.test(r.host)) ? r.brand.mobileUrl : r.brand.desktop;
  } catch(e){}
  return BRANDS[1].desktop;
}

function render(reason){
  /* the reason key is *-desc; the headline swap has to test that, not the
     bare "site-not-found" key, which never equals REASON */
  var headline = (reason === "site-not-found-desc") ? "site-not-found" : "blocking";
  document.title = o("title");
  i("slg-text", "innerText", o(headline));
  i("slg-desc", "innerText", o(reason));
  i("kg-support-link", "innerText", o("support"));
  i("kg-support-link", "href", supportUrl());
  i("kg-event-label", "innerText", o("eventLabel"));
  i("slg-copyright-text", "innerText", o("footer"));
  document.documentElement.lang = pageLocale();
}

render(REASON);

/* Event ID. Upstream wrote this over #slg-desc; it now populates its own chip
   and leaves the reason text intact. Both upstream discovery paths kept. */
function showEvent(id){
  i("kg-event-value", "innerText", id);
  var box = document.getElementById("kg-event");
  if (box) box.className = "is-visible";
}

/* ─────────────────────────────────────────────────────────────────────────────
   Block-page telemetry.

   Separate from the challenge-failure path below: a block page is terminal.
   There is no verification to fail, no #sl-error to watch and no reload — the
   visitor is simply refused. The only signal is REASON, which is fixed per
   Custom HTML page, so the event fires once on load.

   Class groups reasons by who owns the problem, which is the split that
   matters when reading the numbers: security/ratelimit are the visitor,
   upstream/maintenance are ours, routing is either.
   ───────────────────────────────────────────────────────────────────────────── */
/* ─────────────────────────────────────────────────────────────────────────────
   Host guard.

   The inlined bundle is pinned to krisha-frontend-user-events-prod. If this
   same Custom HTML is ever attached to another site in SafeLine — kolesa.kz,
   a staging host — every event would land in Krisha's topic and quietly
   corrupt it. Cheaper to refuse here than to filter it out downstream.

   The anchors matter: (^|\.) stops evilkrisha.kz matching, and $ stops
   krisha.kz.attacker.com matching. Subdomains are in scope on purpose —
   m.krisha.kz and www.krisha.kz are the same product. All paths under the
   host are in scope automatically; there is nothing to enumerate.
   ───────────────────────────────────────────────────────────────────────────── */
var KG_HOST_RE = /(^|\.)krisha\.kz$/i;

function kgHostAllowed(){
  try { return KG_HOST_RE.test(location.hostname); } catch(e){ return false; }
}

/* Visitor id cookie. Read fresh at each call rather than cached at parse time:
   on a first-ever visit the app may not have set it yet when this script runs,
   and a challenge can outlive that gap by several seconds.

   Returns "" when absent — an empty string is a truthful "this visitor had no
   id yet", which is a real and interesting population on a WAF page. */
var KG_ID_COOKIE = "kraid";

function kgCookie(name){
  try {
    var esc = name.replace(/([.*+?^${}()|[\]\\])/g, "\\$1");
    var m = document.cookie.match(new RegExp("(?:^|;\\s*)" + esc + "=([^;]*)"));
    return m ? decodeURIComponent(m[1]) : "";
  } catch(e){ return ""; }
}

/* Every field these pages emit is namespaced waf_ so the rows are
   distinguishable from ordinary site events sharing the topic. Applied here
   rather than written into each literal: twelve hand-prefixed keys is twelve
   chances to typo one, and any field added later inherits this for free.

   Guarded against double-prefixing so it stays idempotent. Note the lib adds
   its own event_ prefix when flattening, so a key ends up as
   event_waf_challenge_error downstream. */
function wafPrefix(obj){
  var out = {}, k;
  for (k in obj) {
    if (!Object.prototype.hasOwnProperty.call(obj, k)) continue;
    out[k.indexOf("waf_") === 0 ? k : "waf_" + k] = obj[k];
  }
  return out;
}

var REASON_CLASS = {
  "attack-desc":          "security",
  "too-fast-desc":        "ratelimit",
  "page-not-found-desc":  "routing",
  "site-not-found-desc":  "routing",
  "offline":              "maintenance",
  "gateway-error-desc":   "upstream",
  "gateway-timeout-desc": "upstream",
  "unknown":              "other"
};

var blockEventSent = false;

/**
 * @param {string|null} eventId SafeLine's request id, when the page carries one
 */
function sendBlockEvent(eventId){
  if (blockEventSent || !kgHostAllowed()) return;
  blockEventSent = true;

  var reason = REASON_CLASS[REASON] ? REASON : "unknown";

  var params = {
    challenge_success: "0",
    challenge_error:   reason,
    reason_class:      REASON_CLASS[reason],
    kraid:             kgCookie(KG_ID_COOKIE),
    /* The English source text, not o(REASON): the localised string would make
       the same block look like four different things depending on the
       visitor's browser language. */
    reason_text:       (t[reason] && t[reason].en) || "",
    page:              "safeline_block",
    host:              location.hostname,
    path:              location.pathname,
    query:             location.search,
    ref:               document.referrer || "",
    /* Present on block pages only, and the one field that joins these rows to
       SafeLine's own logs. */
    event_id:          eventId || ""
  };

  try {
    if (window.KGStream && typeof window.KGStream.send === "function") {
      window.KGStream.send("waf_challenge_failed", wafPrefix(params));
    }
  } catch(e){}
}

/* ─────────────────────────────────────────────────────────────────────────────
   Mode detection.

   SafeLine appends its bootstrap after this script, so document.scripts does
   not contain it yet — the check has to wait for DOMContentLoaded. This
   listener is registered before SafeLine's, so it runs first and the class is
   set before challenge.js is even requested.
   ───────────────────────────────────────────────────────────────────────────── */
function isChallenge(){
  try {
    return Array.prototype.some.call(document.scripts, function(sc){
      if (sc === KG_SELF) return false;           /* never match ourselves */
      return sc.textContent && sc.textContent.indexOf("SafeLineChallenge") !== -1;
    });
  } catch(e){ return false; }
}

/* Same source as the block page: the URL, not the browser. Keeping these two
   in step matters — a page whose own copy is Russian while the challenge widget
   is Kazakh looks broken, and the success/failure watchers match on the swapped
   strings, so a mismatch here silently costs events. */
function lang2(){
  return pageLocale();
}

/* challenge.js keeps its string table inside a Parcel closure — not on window,
   and s() is private. Nothing to reassign, so intercept the DOM write.

   Matching on the exact English source prevents a loop: after the swap the
   test is false, so the re-triggered pass is a no-op.

   Every branch is wrapped. challenge.js ends with
       window.onerror = function(e,t,n,r,o){ o && g("unknown", e) }
   so any uncaught throw here repaints the page as a red "Unknown Error" —
   a typo becomes indistinguishable from a broken WAF. */
var CH_STR = {
  ru: {
    "Client Verifying":      "Проверяем браузер",
    "Confirm You Are Human": "Подтвердите, что вы не робот",
    "Confirm":               "Подтвердить",
    "Slide to Verify":       "Потяните ползунок вправо",
    "Verification Complete": "Проверка пройдена, открываем сайт",
    "Verification Failed":   "Проверка не пройдена",
    "Connection Failed":     "Сервис проверки недоступен",
    "Debugging Detected":    "Обнаружены инструменты разработчика",
    "Too Fast, Slow Down":   "Слишком быстро — попробуйте медленнее",
    "Too Slow, Slide Fast":  "Слишком медленно — попробуйте ещё раз",
    "Unknown Error":         "Что-то пошло не так"
  },
  kk: {
    "Client Verifying":      "Браузерді тексерудеміз",
    "Confirm You Are Human": "Робот емесіңізді растаңыз",
    "Confirm":               "Растау",
    "Slide to Verify":       "Тетікті оңға тартыңыз",
    "Verification Complete": "Тексеру өтті, сайт ашылады",
    "Verification Failed":   "Тексеру өтпеді",
    "Connection Failed":     "Тексеру қызметі қолжетімсіз",
    "Debugging Detected":    "Әзірлеуші құралдары анықталды",
    "Too Fast, Slow Down":   "Тым жылдам — жайлап көріңіз",
    "Too Slow, Slide Fast":  "Тым жайлап — қайта көріңіз",
    "Unknown Error":         "Бірдеңе дұрыс болмады"
  }
};

function startChallengeMode(){
  document.documentElement.className += " kg-challenge";
  try { document.title = o("titleCheck"); } catch(e){}

  /* Intercept the location.reload() that challenge.js calls on success.
     We replace it with a navigation to the same URL plus ?challenge_success=1
     so the app can track successful verifications. */
  /* One id per challenge view, threaded through all three outcomes: the shown
     event below, the failure event, and the success URL. Without it the three
     are unjoinable — you can count them but never follow one visitor from
     "challenge appeared" to what happened next. */
  var viewId;
  try {
    viewId = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : String(Date.now()) + "-" + Math.random().toString(16).slice(2);
  } catch(e) { viewId = String(Date.now()); }

  var basePar = {
    challenge_view_id: viewId,
    page:              "safeline_challenge",
    host:              location.hostname,
    path:              location.pathname,
    query:             location.search,
    ref:               document.referrer || ""
  };

  function kgSend(name, extra){
    try {
      if (!kgHostAllowed()) return;
      if (!window.KGStream || typeof window.KGStream.send !== "function") return;
      var p = {}, k;
      for (k in basePar) p[k] = basePar[k];
      for (k in (extra || {})) p[k] = extra[k];
      /* Read at send time, not from basePar: the shown event and a failure a
         minute later can legitimately differ if the app set the cookie in
         between. */
      p.kraid = kgCookie(KG_ID_COOKIE);
      window.KGStream.send(name, wafPrefix(p));
    } catch(e){}
  }

  /* Fired on arrival, before anything can go wrong. This is the denominator:
     failures and successes are only interpretable against how many visitors
     were shown a challenge at all. */
  kgSend("waf_challenge_shown", {});

  /* The success event is sent by the text watcher below, so the reload is left
     to do exactly what challenge.js intends: re-request the same URL, which the
     WAF now lets through on the strength of the JWT cookie. No query params are
     appended — the event carries everything, and a param would otherwise follow
     the visitor into share links, Referer headers and the app's own page views.

     The override exists only as a last-chance send. Native reload is captured
     first and the override installed only if that succeeded: a broken reload
     would strand the visitor on the challenge page with no way through, which
     is far worse than a missed analytics event. */
  if (kgHostAllowed()) {
    try {
      var nativeReload = location.reload.bind(location);
      if (typeof nativeReload === "function") {
        location.reload = function() {
          /* Normally a no-op — the watcher fired a second earlier. Only does
             work if that signal was missed, and then a request racing the
             navigation still beats no request at all. */
          try { sendSuccessBeacon(); } catch(e){}
          nativeReload();
        };
      }
    } catch(e){}
  }

  /* Move #sl-box into the card. challenge.js appends it to <body> some time
     after its own DOMContentLoaded handler injects the script, so watch for it
     rather than poll. */
  function adopt(){
    var box = document.getElementById("sl-box");
    var card = document.getElementById("slg-box");
    if (!box || !card) return false;
    if (box.parentNode !== card) {
      /* insertBefore, not appendChild: #kg-support is the last child of the
         card, and appending would leave the support link sitting above the
         verification content instead of below it. */
      var cta = document.getElementById("kg-support");
      if (cta && cta.parentNode === card) card.insertBefore(box, cta);
      else card.appendChild(box);
    }
    return true;
  }
  if (!adopt()) {
    try {
      var mo = new MutationObserver(function(){
        try { if (adopt()) mo.disconnect(); } catch(e){}
      });
      mo.observe(document.body, {childList:true});
    } catch(e){}
  }

  /* ───────────────────────────────────────────────────────────────────────
     Failure beacon.

     challenge.js's g() is the only failure path, and it is private to a Parcel
     closure — nothing to hook. What g() does observably is write an inline
     display onto #sl-error, which a stylesheet cannot do, so watching that
     attribute is the reliable signal.

     Sent from this page directly: SafeLine takes one Custom HTML blob and
     nothing else, so there is no second document to defer to and the
     event-stream bundle has to be inlined above. Nothing is navigated —
     navigating would drop the user onto a fresh challenge page with the error
     screen gone, and for the level-1 paths that fail without user input
     (connection-failed, on-debug) it would loop the reload forever.
     ─────────────────────────────────────────────────────────────────────── */
  var CH_REASON = {
    "Verification Failed": "failed",
    "Connection Failed":   "connection-failed",
    "Debugging Detected":  "on-debug",
    "Unknown Error":       "unknown"
  };

  /* #sl-text may already carry our own translation by the time this runs, so
     match the English source first, then walk the active locale map back. */
  function reasonSlug(){
    try {
      var el = document.getElementById("sl-text");
      var txt = el ? el.innerText : "";
      if (CH_REASON[txt]) return CH_REASON[txt];
      var m = CH_STR[lang2()], en;
      if (m) for (en in m) if (m[en] === txt && CH_REASON[en]) return CH_REASON[en];
    } catch(e){}
    return "unknown";
  }

  var beaconSent = false;
  function sendFailureBeacon(){
    if (beaconSent) return;
    beaconSent = true;

    var slug = reasonSlug();

    /* kgSend supplies challenge_view_id, page, host, path, query and ref.
       The challenge is served in place, so path/query still describe the URL
       the visitor actually asked for — the only record of what was being
       challenged when this failed. */
    kgSend("waf_challenge_failed", {
      challenge_success: "0",
      challenge_error:   slug,
      /* Same field names as the block event so both populations sit in one
         schema; page tells them apart. Challenge failures are all verification
         faults, so the class is constant. */
      reason_class:      "verification",
      reason_text:       slug
    });
  }

  var successSent = false;
  function sendSuccessBeacon(){
    if (successSent) return;
    successSent = true;

    kgSend("waf_challenge_success", {
      challenge_success: "1",
      /* No error to report, but the field is kept so both outcomes share a
         schema and a single query can pivot on challenge_success. */
      challenge_error:   "",
      reason_class:      "verification",
      reason_text:       "finished"
    });
  }

  /* Success has no #sl-error equivalent — challenge.js signals it by writing
     the "finished" string into #sl-text, then reloading 1000ms later. Sending
     here rather than from the reload override is deliberate: a fetch started
     inside the override races the navigation that immediately follows it and
     is liable to be cancelled in flight. Firing on the text change spends that
     one-second gap on the request instead.

     Matched the same way as reasonSlug: English source first, then the active
     locale map walked backwards, since our own swap may already have rewritten
     the node. */
  function isFinishedText(txt){
    if (!txt) return false;
    if (txt === "Verification Complete") return true;
    try {
      var m = CH_STR[lang2()];
      if (m && m["Verification Complete"] === txt) return true;
    } catch(e){}
    return false;
  }

  try {
    var okWatch = new MutationObserver(function(){
      try {
        var el = document.getElementById("sl-text");
        if (el && isFinishedText(el.innerText)) {
          okWatch.disconnect();
          sendSuccessBeacon();
        }
      } catch(e){}
    });
    okWatch.observe(document.documentElement,
      {childList:true, characterData:true, subtree:true});
  } catch(e){}

  try {
    var errWatch = new MutationObserver(function(){
      try {
        var err = document.getElementById("sl-error");
        /* g() writes display:unset; the stylesheet default is display:none */
        if (err && err.style.display && err.style.display !== "none") {
          errWatch.disconnect();
          sendFailureBeacon();
        }
      } catch(e){}
    });
    errWatch.observe(document.documentElement,
      {attributes:true, attributeFilter:["style"], subtree:true});
  } catch(e){}

  var map = CH_STR[lang2()];
  if (!map) return;                     /* en and zh ship correctly upstream */
  function swap(){
    var ids = ["sl-text","sl-check-text"], k, el;
    for (k = 0; k < ids.length; k++) {
      el = document.getElementById(ids[k]);
      if (el && map[el.innerText]) el.innerText = map[el.innerText];
    }
  }
  try {
    new MutationObserver(function(){ try { swap(); } catch(e){} })
      .observe(document.documentElement, {childList:true, characterData:true, subtree:true});
    swap();
  } catch(e){}
}

document.addEventListener("DOMContentLoaded", function(){
  /* Gate everything below. On a challenge page there is no event_id by design,
     and running the fallback is what printed "Что-то пошло не так" under the
     loader. */
  if (isChallenge()) { try { startChallengeMode(); } catch(e){} return; }

  var found = null;
  try {
    var sib = document.getElementsByTagName("html")[0].nextSibling;
    if (sib && sib.data) {
      var m = sib.data.match(/event_id:\s*([a-f0-9]+)/);
      if (m) found = m[1];
    }
    if (!found) {
      var node = document.evaluate('//comment()[contains(., "event_id")]',
                    document, null, XPathResult.ANY_TYPE, null).iterateNext();
      if (node) {
        var m2 = node.textContent.trim().match(/event_id:\s*([a-f0-9]+)/);
        if (m2) found = m2[1];
      }
    }
  } catch(e){}

  if (found) {
    showEvent(found);
  } else {
    /* Upstream treats a missing event_id as an engine fault. Preserved,
       but localised and without the alarming wording. */
    i("slg-text", "innerText", o("engine_abnormal"));
    i("slg-desc", "innerText", o("engine_desc"));
  }

  /* After the scrape either way — a block with no event_id is still a block,
     and losing those rows would quietly bias the counts toward whichever
     reasons happen to carry an id. */
  try { sendBlockEvent(found); } catch(e){}
});

document.addEventListener("click", function(ev){
  var b = ev.target.closest && ev.target.closest("#kg-event-copy");
  if (!b) return;
  var v = document.getElementById("kg-event-value");
  if (!v) return;
