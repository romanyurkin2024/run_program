name: Scrape

on:
  schedule:
    # GitHub откладывает и иногда пропускает запуски «ровно в час» (пиковая нагрузка), поэтому:
    # основной запуск не на :00, и страховочный через час — он ничего не делает, если данные за сегодня уже есть
    - cron: "13 1 * * *" # 06:13 по Алматы
    - cron: "23 2 * * *" # 07:23 по Алматы, страховка
  workflow_dispatch:
    inputs:
      probe:
        description: "Отладка: сохранить сырые страницы в ветку probe"
        type: boolean
        default: false
      notify:
        description: "Отправить отчёт в Telegram"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m unittest scraper.test_scraper
      - name: Scrape
        shell: bash # включает pipefail, чтобы ошибка парсера не терялась за tee
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # по расписанию inputs пустые — отчёт отправляется; вручную можно выключить
          SKIP_TELEGRAM: ${{ inputs.notify == false && '1' || '' }}
        run: python -m scraper.run ${{ inputs.probe && '--probe' || '' }} ${{ github.event_name == 'schedule' && '--if-stale' || '' }} 2>&1 | tee scrape.log
      - name: Push probe pages
        if: ${{ inputs.probe }}
        run: |
          mkdir -p debug && cp scrape.log debug/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe
          git rm -rfq --cached .
          git add -f debug
          git commit -qm "Probe pages $(date -u +%FT%TZ)"
          git push -f origin probe
      - name: Commit data
        if: ${{ !inputs.probe }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet && exit 0
          git commit -m "Data: $(date -u +%F)"
          # пока шёл сбор, в main могли прийти другие коммиты (код сайта) — данные меняет только сборщик, конфликтов нет
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
          exit 1

  deploy:
    needs: scrape
    if: ${{ !inputs.probe }}
    uses: ./.github/workflows/deploy.yml
